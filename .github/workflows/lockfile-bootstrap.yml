name: Temporary lockfile bootstrap

on:
  push:
    branches: [lockfile-bootstrap]

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate pnpm lockfile without installing packages
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile to bootstrap branch
        run: |
          if [ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(deps): add reproducible pnpm lockfile"
            git push
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: web-temify-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
