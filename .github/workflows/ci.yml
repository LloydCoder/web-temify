name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Do not cancel the only full-stack validation run when several small commits land
# in quick succession. Each candidate must reach a terminal result so a cancelled
# run cannot be mistaken for a failing test or leave the latest head unverified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate foundation and tests
        run: pnpm check:foundation
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Print Prettier output for moderation appeal E2E test
        if: always()
        shell: bash
        run: |
          echo "FORMAT_START:tests/e2e/moderation-appeals.spec.ts"
          pnpm exec prettier tests/e2e/moderation-appeals.spec.ts
          echo "FORMAT_END:tests/e2e/moderation-appeals.spec.ts"
      - name: Print Prettier output for native V3 integration files
        if: always()
        shell: bash
        run: |
          for file in src/app/globals.css src/components/v3-homepage-interactions.tsx src/components/v3-homepage.tsx tests/e2e/homepage.spec.ts; do
            echo "FORMAT_START:$file"
            pnpm exec prettier "$file"
            echo "FORMAT_END:$file"
          done
      - name: Formatting check
        run: pnpm format:check
      - name: Install Supabase CLI
        id: supabase-cli
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.107.0
      - name: Start local Supabase services
        run: supabase start -x studio,imgproxy,inbucket
      - name: Apply migrations from an empty database
        run: supabase db reset
      - name: Lint database schema and policies
        run: supabase db lint --local
      - name: Run database and RLS tests
        run: supabase test db
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Install pinned PostgreSQL concurrency-test client
        run: npm ci --prefix scripts/phase4d2-concurrency
      - name: Run true two-session settlement reconciliation race test
        run: |
          set -euo pipefail
          db_url="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$db_url"
          SUPABASE_DB_URL="$db_url" node scripts/test-phase4d2-reconciliation-concurrency.mjs
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: Stop local Supabase services
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop
