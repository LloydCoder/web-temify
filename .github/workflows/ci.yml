name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate foundation and tests
        run: pnpm check:foundation
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting check
        run: |
          pnpm exec prettier --write packages/domain-contracts/src/index.test.ts
          git diff -- packages/domain-contracts/src/index.test.ts
      - name: Install Supabase CLI
        id: supabase-cli
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.107.0
      - name: Start local Supabase services
        run: supabase start -x studio,imgproxy,inbucket
      - name: Apply migrations from an empty database
        run: supabase db reset
      - name: Lint database schema and policies
        run: supabase db lint --local
      - name: Run database and RLS tests
        run: supabase test db
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: Stop local Supabase services
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop
