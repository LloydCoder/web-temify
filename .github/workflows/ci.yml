name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate foundation and tests
        run: pnpm check:foundation
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Install Supabase CLI
        id: supabase-cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Start local Supabase services
        run: supabase start -x studio,imgproxy,inbucket
      - name: Apply migrations from an empty database
        run: supabase db reset
      - name: Run database and RLS tests
        run: supabase test db
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: Stop local Supabase services
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop
