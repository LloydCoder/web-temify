name: Temporary scanner formatting

on:
  push:
    branches:
      - feat/phase4d2-clamav-scanner-service
    paths:
      - .github/workflows/temporary-scanner-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format scanner changes
        run: >-
          pnpm exec prettier --write
          services/settlement-scanner/README.md
          services/settlement-scanner/server.mjs
          services/settlement-scanner/server.test.mjs
          src/app/api/admin/settlements/evidence/route.ts
          src/server/commerce/settlement-evidence-scanner.test.ts
          src/server/commerce/settlement-evidence-scanner.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/settlement-scanner/README.md services/settlement-scanner/server.mjs services/settlement-scanner/server.test.mjs src/app/api/admin/settlements/evidence/route.ts src/server/commerce/settlement-evidence-scanner.test.ts src/server/commerce/settlement-evidence-scanner.ts
          git commit -m "style(scanner): apply Prettier formatting [prettier-autofix]"
          git push origin HEAD:${GITHUB_REF_NAME}
