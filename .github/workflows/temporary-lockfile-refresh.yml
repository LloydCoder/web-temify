name: Temporary dependency patch regeneration

on:
  push:
    branches: [phase1-security-baseline]

permissions:
  contents: write

concurrency:
  group: temporary-patch-regeneration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted dependency-upgrade branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install the unpatched graph before generating the canonical patch
        run: pnpm install --no-frozen-lockfile
      - name: Create pnpm patch workspace
        run: pnpm patch braces@3.0.3
      - name: Apply nesting limit to patched source
        shell: bash
        run: |
          PATCH_DIR="$(find node_modules/.pnpm_patches -mindepth 1 -maxdepth 1 -type d -name 'braces@3.0.3*' -print -quit)"
          test -n "$PATCH_DIR"
          node -- "$PATCH_DIR/lib/parse.js" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const source = fs.readFileSync(file, "utf8");
          const needle = "if (value === CHAR_LEFT_CURLY_BRACE) {\n      depth++;";
          if (!source.includes(needle)) {
            throw new Error("Could not locate braces parser nesting counter");
          }
          const replacement = needle + "\n      if (depth > 100) {\n        throw new SyntaxError('Brace nesting exceeds maximum depth');\n      }";
          fs.writeFileSync(file, source.replace(needle, replacement));
          NODE
          echo "PATCH_DIR=$PATCH_DIR" >> "$GITHUB_ENV"
      - name: Generate canonical patch metadata with pnpm
        run: pnpm patch-commit "$PATCH_DIR"
      - name: Refresh lockfile and verify patched installation
        run: pnpm install --no-frozen-lockfile
      - name: Commit patch and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-workspace.yaml pnpm-lock.yaml patches/braces@3.0.3.patch
          git commit -m "security: generate canonical braces patch metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
