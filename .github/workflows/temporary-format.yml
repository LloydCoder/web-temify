name: Temporary repository formatting

on:
  push:
    branches: [phase1-security-baseline]

permissions:
  contents: write

concurrency:
  group: temporary-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format supported repository files
        run: pnpm exec prettier --write .
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format repository with Prettier"
          git push origin "HEAD:${GITHUB_REF_NAME}"
