name: Temporary format diff inspection

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate formatter diff for review
        run: |
          pnpm exec prettier --write docs/audits/phase4d2-exception-queue-slice.md src/app/admin/settlements/page.tsx src/app/admin/settlements/SettlementExceptionDecisionForm.tsx 'src/app/api/admin/settlements/[runId]/decision/route.ts' src/server/commerce/settlement-exception-decision.test.ts src/server/commerce/settlement-exception-decision.ts
          git diff --no-ext-diff -- docs/audits/phase4d2-exception-queue-slice.md src/app/admin/settlements/page.tsx src/app/admin/settlements/SettlementExceptionDecisionForm.tsx 'src/app/api/admin/settlements/[runId]/decision/route.ts' src/server/commerce/settlement-exception-decision.test.ts src/server/commerce/settlement-exception-decision.ts
